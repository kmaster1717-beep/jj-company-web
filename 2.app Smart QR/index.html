<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JJ Smart QR - Premium QR Code Generator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- QRCode library via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>
    <div class="background-glows">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="brand-logo">
                <div class="logo-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="brand-names">
                    <span class="brand-title">JJ COMPANY</span>
                    <span class="brand-subtitle">스마트 QR 코드 솔루션</span>
                </div>
            </div>
            <div class="app-badge">
                <span class="badge-text">Smart QR</span>
            </div>
        </header>

        <!-- Main Card -->
        <main class="main-content">
            <div class="qr-card" id="qr-card">
                <div class="card-inner">
                    <!-- QR Display Area (transitions into view) -->
                    <div class="qr-display-area" id="qr-display-area">
                        <div class="qr-code-wrapper" id="qr-code-wrapper" title="클릭하여 JPG로 다운로드">
                            <canvas id="qr-canvas"></canvas>
                            <div class="qr-overlay">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="download-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                <span>JPG 다운로드</span>
                            </div>
                        </div>
                        <p class="qr-instructions">QR코드를 클릭하면 JPG 파일로 다운로드됩니다.</p>
                    </div>

                    <!-- Input Area -->
                    <div class="input-area" id="input-area">
                        <label for="url-input" class="input-label">URL 입력</label>
                        <div class="input-group">
                            <input type="url" id="url-input" placeholder="https://example.com" autocomplete="off" required>
                            <button id="generate-btn" aria-label="QR 코드 생성">
                                <span class="btn-text">생성</span>
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p class="footer-info">마지막 업데이트: 2026. 8. 17</p>
            <p class="footer-copyright">&copy; 2026 JJ Company. All rights reserved.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
